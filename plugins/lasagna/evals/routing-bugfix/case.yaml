schema_version: "1.1"
name: routing-bugfix
tags: [fast, routing]
runs: 3
execution:
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Use the lasagna harness for this. `cart_total` in src/shop/cart.py returns 20 for
    prices [10, 20] instead of 30. Everyone agrees it must return the sum of all prices.
context:
  scaffold_script: fixture.sh
graders:
  - name: routes-to-bugfix
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?characterize-bugfix"'
    min: 1
  - name: no-fix-before-a-test
    type: tool_used
    tool: Edit
    input_match: 'src[\\\\/]+shop'
    min: 0
    max: 0
