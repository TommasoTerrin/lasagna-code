schema_version: "1.1"
name: routing-brownfield
tags: [fast, routing]
runs: 3
execution:
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Use the lasagna harness: change the cart code so the total also includes 22% VAT.
    There is no spec describing the existing cart code.
context:
  scaffold_script: fixture.sh
graders:
  - name: routes-to-reverse-spec
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?reverse-spec-brownfield"'
    min: 1
