schema_version: "1.1"
name: architecture-greenfield
tags: [fast, architecture]
runs: 3
execution:
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    Use the lasagna harness to build a new command-line tool: it imports a CSV of bank
    transactions and categorises each one by user-defined rules. Decided, build it.
context:
  scaffold_script: fixture.sh
graders:
  - name: asks-separation-level-with-reason
    type: llm
    focus: last_message
    criteria: |
      PASS if the response asks the user how much to separate logic from I/O, offering
      levels like minimal / modular / full-hexagonal, and recommends one with a reason
      tied to this project (e.g. little I/O, rules are pure logic). FAIL if it imposes
      an architecture without asking, or asks without recommending.
