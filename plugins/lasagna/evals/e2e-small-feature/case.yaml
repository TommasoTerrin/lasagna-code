schema_version: "1.1"
name: e2e-small-feature
tags: [slow, release]
runs: 1
execution:
  max_turns: 150
  timeout_seconds: 3600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, Agent]
  prompt: |
    Resume the lasagna feature in progress (FEAT-001): spec and contract are already
    approved. Run the tdd-loop to the end, then the adversarial review. Stop at the PR
    gate.
context:
  scaffold_script: fixture.sh
graders:
  - name: suite-green
    type: regex
    target: {source: file, path: ".lasagna/state/FEAT-001.state.md"}
    pattern: 'last_test_result: green'
  - name: criteria-covered
    type: regex
    target: {source: file, path: ".lasagna/state/FEAT-001.state.md"}
    pattern: 'AC-FEAT-001-00[12]: open'
    match: not_contains
  - name: loop-used-isolated-agents
    type: tool_used
    tool: Agent
    input_match: 'implementer'
    min: 1
  - name: stops-at-pr-gate
    type: llm
    focus: last_message
    criteria: |
      PASS if the final message presents the PR gate (traceability, adversarial findings,
      cycles consumed) and waits for a human. FAIL if it merges, or stops before the
      loop is done without an escalation reason.
