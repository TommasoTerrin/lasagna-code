name: 🧪 Hooks — lint and tests

on:
  push:
    branches: [main, develop, v2]
    paths:
      - 'plugins/lasagna/scripts/**'
      - 'plugins/lasagna/hooks/**'
      - 'plugins/lasagna/templates/**'
      - 'plugins/lasagna/**/*.md'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'plugins/lasagna/scripts/**'
      - 'plugins/lasagna/hooks/**'
      - 'plugins/lasagna/templates/**'
      - 'plugins/lasagna/**/*.md'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/lint.yml'

jobs:
  test:
    name: pytest · Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    defaults:
      run:
        shell: bash  # Git Bash on Windows: the same sh Claude Code runs hooks with

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 📦 Test tools (the hooks themselves need only the standard library)
        run: python -m pip install pytest ruff

      - name: 🔤 ruff
        run: ruff check plugins/lasagna/scripts tests tools

      - name: ✅ pytest
        run: python -m pytest -rs

  shellcheck:
    name: shellcheck run.sh
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📝 The one shell script left
        run: shellcheck --shell=sh plugins/lasagna/scripts/run.sh
